    <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.0.0"></script>

    <!-- This is the style sheet and we are specifying that it is a stylesheet conotaining css code-->

<script>
    // Here is jsPsych Code. Initialize jsPsych and assign that to the variable called jsPsych.
    // initJsPsych() is an initializer for jsPsych that returns an object to manage the experiment
    // We will hold that in the variable called jsPsych
    // This is analagous to `Experiment experiment = new Experiment();`
    // This is similar to a constructor but this is a function that returns an object rather than creating an instance of a class
    // We are intiailizing jsPsych thenfunction (the experiment manager) and return an object and stpre that reference in psPsych

    var jsPsych = initJsPsych();

    // jsPsych are defined by the timeline variable, an array that contains the list of trials.
    // Let us create an empty array and we can add to this array when we create new trials

    var timeline = [];

    var welcome = {
        type: jsPsychHtmlKeyboardResponse,
        stimulus: "Welcome to the study! We are happy you are here. Press any key to begin."
    }

    timeline.push(welcome)

    jsPsych.run(timeline);

</script>
